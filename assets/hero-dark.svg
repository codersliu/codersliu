    <text x="48" y="150" fill="#eef4f6" font-size="62" font-weight="700" letter-spacing="-2">Agent</text>
    <text x="48" y="218" fill="#eef4f6" font-size="62" font-weight="700" letter-spacing="-2">Engineering.</text>
    <text x="50" y="268" fill="#a3b6c2" font-size="23">Building agents that get work done.</text>
