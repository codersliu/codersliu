    <text x="50" y="352" fill="#7de1ca" font-size="15" font-weight="700" letter-spacing="1">RUNTIMES</text>
    <text x="195" y="352" fill="#a3b6c2" font-size="15" letter-spacing="1">/</text>
    <text x="224" y="352" fill="#7de1ca" font-size="15" font-weight="700" letter-spacing="1">DEV TOOLS</text>
    <text x="382" y="352" fill="#a3b6c2" font-size="15" letter-spacing="1">/</text>
    <text x="411" y="352" fill="#7de1ca" font-size="15" font-weight="700" letter-spacing="1">DOCUMENT AI</text>
    <text x="50" y="397" fill="#a3b6c2" font-size="14" letter-spacing="2">PLAN / EXECUTE / VERIFY</text>
    <rect x="778" y="55" width="374" height="330" rx="16" fill="#16232d" stroke="#30444e"/>
    <circle cx="803" cy="82" r="4" fill="#7de1ca"/>
    <text x="817" y="87" fill="#a3b6c2" font-size="12" letter-spacing="2">THE EXECUTION LOOP</text>
