    <rect x="801" y="137" width="32" height="32" rx="8" fill="#1d3538"/>
    <text x="817" y="158" text-anchor="middle" fill="#7de1ca" font-size="13">01</text>
    <text x="853" y="151" fill="#eef4f6" font-size="18" font-weight="700">TASK</text>
    <text x="853" y="172" fill="#a3b6c2" font-size="13">Intent, context, constraints</text>
    <rect x="801" y="211" width="32" height="32" rx="8" fill="#1d3538"/>
    <text x="817" y="232" text-anchor="middle" fill="#7de1ca" font-size="13">02</text>
    <text x="853" y="225" fill="#eef4f6" font-size="18" font-weight="700">TOOLS</text>
    <text x="853" y="246" fill="#a3b6c2" font-size="13">Bounded actions, visible state</text>
    <rect x="801" y="285" width="32" height="32" rx="8" fill="#1d3538"/>
    <text x="817" y="306" text-anchor="middle" fill="#7de1ca" font-size="13">03</text>
