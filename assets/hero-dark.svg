<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Shun Liu — Agent Engineering</title>
  <desc id="desc">Building agents that get work done. A task moves through tools and verification. Agent runtimes, developer tools, document AI.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30444e" stroke-opacity=".32"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="20" fill="#101820"/>
  <rect x="735" width="465" height="440" rx="20" fill="url(#grid)"/>
  <path d="M48 54h24" stroke="#7de1ca" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif">
